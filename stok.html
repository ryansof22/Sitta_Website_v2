<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Stok Bahan Ajar - SITTA UT</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
</head>
<body>
    <div id="app">
        <div class="navbar">
            <a href="index.html">Home</a>
            <a href="stok.html" style="text-decoration: underline;">Stok Bahan Ajar</a>
            <a href="tracking.html">Tracking DO</a>
        </div>

        <div style="padding: 20px;">
            <h2 class="gold-text">Manajemen Stok Bahan Ajar</h2>

            <div class="card">
                <h3 class="gold-text">Tambah Stok Baru</h3>
                <input v-model="newStok.kode" placeholder="Kode">
                <input v-model="newStok.judul" placeholder="Judul">
                <select v-model="newStok.upbjj">
                    <option value="">Pilih UPBJJ</option>
                    <option v-for="u in upbjjList" :value="u">{{u}}</option>
                </select>
                <input type="number" v-model.number="newStok.qty" placeholder="Qty">
                <input type="number" v-model.number="newStok.safety" placeholder="Safety">
                <button @click="tambahStok">Tambah</button>
                <p v-if="errorMsg" style="color: red;">{{errorMsg}}</p>
            </div>

            <div class="card">
                <h3 class="gold-text">Filter & Sort</h3>
                <select v-model="filterUPBJJ">
                    <option value="">Semua UT-Daerah</option>
                    <option v-for="u in upbjjList" :value="u">{{u}}</option>
                </select>

                <select v-if="filterUPBJJ" v-model="filterKategori">
                    <option value="">Semua Kategori</option>
                    <option v-for="k in kategoriList" :value="k">{{k}}</option>
                </select>

                <label><input type="checkbox" v-model="isCritical"> Stok Kritis (Qty < Safety)</label>
                
                <select v-model="sortBy">
                    <option value="judul">Urut Judul</option>
                    <option value="qty">Urut Stok</option>
                    <option value="harga">Urut Harga</option>
                </select>
                <button @click="resetFilter">Reset</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Kode/Judul</th>
                        <th>UPBJJ</th>
                        <th>Qty / Safety</th>
                        <th>Status</th>
                        <th>Catatan</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="item in filteredStok" :key="item.kode">
                        <td><strong>{{item.kode}}</strong><br>{{item.judul}}</td>
                        <td>{{item.upbjj}}</td>
                        <td>{{item.qty}} / {{item.safety}}</td>
                        <td :class="statusClass(item)">{{ getStatus(item) }}</td>
                        <td v-html="item.catatanHTML"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="js/dataBahanAjar.js"></script>
    <script src="js/stok-app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Stok Bahan Ajar - SITTA UT</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
</head>
<body>
    <div id="app">
        <a href="index.html">⬅ Kembali</a>
        <h2>Manajemen Stok Bahan Ajar</h2>

        <div class="filter-box">
            <label>UT-Daerah:</label>
            <select v-model="filterUpbjj">
                <option value="">-- Semua Daerah --</option>
                <option v-for="u in upbjjList" :value="u">{{ u }}</option>
            </select>

            <transition name="fade">
                <span v-if="filterUpbjj">
                    <label>Kategori:</label>
                    <select v-model="filterKategori">
                        <option value="">-- Semua Kategori --</option>
                        <option v-for="k in kategoriList" :value="k">{{ k }}</option>
                    </select>
                </span>
            </transition>

            <label><input type="checkbox" v-model="onlyReorder"> Butuh Re-order</label>
            <button @click="resetFilter">Reset</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Kode/Judul</th>
                    <th>Kategori</th>
                    <th>UPBJJ</th>
                    <th>Stok</th>
                    <th>Status</th>
                    <th>Catatan</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="item in filteredStok" :key="item.kode">
                    <td><strong>{{ item.kode }}</strong><br>{{ item.judul }}</td>
                    <td>{{ item.kategori }}</td>
                    <td>{{ item.upbjj }}</td>
                    <td>{{ item.qty }} / {{ item.safety }}</td>
                    <td :class="statusColor(item)">{{ statusText(item) }}</td>
                    <td v-html="item.catatanHTML"></td>
                </tr>
            </tbody>
        </table>

        <h3>Tambah Stok Baru</h3>
        <form @submit.prevent="addBahanAjar">
            <input v-model="newEntry.kode" placeholder="Kode MK" required>
            <input v-model="newEntry.judul" placeholder="Judul" required>
            <select v-model="newEntry.upbjj" required>
                <option v-for="u in upbjjList" :value="u">{{ u }}</option>
            </select>
            <input type="number" v-model.number="newEntry.qty" placeholder="Qty" required>
            <input type="number" v-model.number="newEntry.safety" placeholder="Safety" required>
            <button type="submit">Simpan</button>
        </form>
    </div>
    <script src="js/stok-app.js"></script>
</body>
</html>

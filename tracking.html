<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tracking DO - SITTA UT</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
</head>
<body>
    <div id="app">
        <a href="index.html">⬅ Kembali ke Beranda</a>
        <h2>Input Delivery Order Baru</h2>

        <form @submit.prevent="simpanDO">
            <div>
                <label>Nomor DO (Auto):</label>
                <input :value="generatedDoNumber" disabled>
            </div>
            <br>
            <div>
                <label>NIM:</label>
                <input v-model="form.nim" required>
            </div>
            <br>
            <div>
                <label>Nama:</label>
                <input v-model="form.nama" required>
            </div>
            <br>
            <div>
                <label>Paket:</label>
                <select v-model="selectedPaketIndex" required>
                    <option v-for="(p, index) in paketList" :value="index">
                        {{ p.kode }} - {{ p.nama }}
                    </option>
                </select>
            </div>
            <br>

            <div v-if="selectedPaketIndex !== null" class="detail-box">
                <p>Isi Paket: {{ paketList[selectedPaketIndex].isi.join(', ') }}</p>
                <p>Harga: Rp {{ paketList[selectedPaketIndex].harga }}</p>
            </div>

            <button type="submit">Buat DO</button>
        </form>

        <hr>
        <h3>Daftar Tracking Terbaru</h3>
        <table border="1" width="100%">
            <tr v-for="(val, key) in tracking">
                <td>{{ key }}</td>
                <td>{{ val.nama }} ({{ val.nim }})</td>
                <td>{{ val.status }}</td>
                <td>Total: Rp {{ val.total }}</td>
            </tr>
        </table>
    </div>
    <script src="js/tracking-app.js"></script>
</body>
</html>

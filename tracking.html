<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tracking DO - SITTA UT</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
</head>
<body>
    <div id="app">
        <a href="index.html">⬅ Kembali</a>
        <h2>Input Delivery Order</h2>

        <form @submit.prevent="submitDO">
            <p><strong>Nomor DO:</strong> {{ nextDoNumber }}</p>
            <input v-model="form.nim" placeholder="NIM" required>
            <input v-model="form.nama" placeholder="Nama Mahasiswa" required>
            
            <label>Paket:</label>
            <select v-model="selectedPaketIdx" required>
                <option :value="null">-- Pilih Paket --</option>
                <option v-for="(p, i) in paket" :value="i">{{ p.kode }} - {{ p.nama }}</option>
            </select>

            <div v-if="selectedPaketIdx !== null" class="detail-box">
                <p><strong>Isi:</strong> {{ paket[selectedPaketIdx].isi.join(', ') }}</p>
                <p><strong>Total Harga:</strong> Rp {{ paket[selectedPaketIdx].harga }}</p>
            </div>

            <button type="submit">Proses Pengiriman</button>
        </form>

        <h3>Riwayat Pengiriman</h3>
        <table>
            <tr><th>No DO</th><th>NIM</th><th>Nama</th><th>Status</th><th>Total</th></tr>
            <tr v-for="(data, id) in tracking" :key="id">
                <td>{{ id }}</td>
                <td>{{ data.nim }}</td>
                <td>{{ data.nama }}</td>
                <td>{{ data.status }}</td>
                <td>Rp {{ data.total }}</td>
            </tr>
        </table>
    </div>
    <script src="js/tracking-app.js"></script>
</body>
</html>
